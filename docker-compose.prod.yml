# ============================================
# Net-On — Production Docker Compose
# ============================================

services:
  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:1.27-alpine
    container_name: neton-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infrastructure/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - web
      - api
    networks:
      - neton

  # --- Next.js Frontend ---
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/web.Dockerfile
    container_name: neton-web
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://api:3001
    networks:
      - neton

  # --- NestJS API ---
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: neton-api
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/v1/health/live || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - neton

  # --- BullMQ Worker ---
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/api.Dockerfile
    container_name: neton-worker
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - neton

  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: neton-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-neton}
      POSTGRES_USER: ${DB_USER:-neton}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-neton} -d ${DB_NAME:-neton}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neton
    # NEVER expose PostgreSQL publicly in production
    # ports are intentionally omitted

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: neton-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - neton

volumes:
  postgres_data:
  redis_data:

networks:
  neton:
    driver: bridge
